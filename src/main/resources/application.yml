spring:
  application:
    name: enterprise-agent-platform
  profiles:
    default: local

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      probes:
        enabled: true

ai-platform:
  retrieval:
    query-rewrite-enabled: false
    rerank-enabled: false
    candidate-limit: 20
    minimum-rrf-score: 0.016
    minimum-token-overlap: 0.15
  workflow:
    max-reflections: 3
  ingestion:
    rabbit:
      queue: knowledge.ingestion.queue
  memory:
    type: memory
    max-messages: 20
    ttl-seconds: 3600
  llm:
    enabled: ${AI_PLATFORM_LLM_ENABLED:true}
    base-url: ${AI_PLATFORM_LLM_BASE_URL:}
    api-key: ${AI_PLATFORM_LLM_API_KEY:}
    model-name: ${AI_PLATFORM_LLM_MODEL_NAME:}
---
spring:
  config:
    activate:
      on-profile: local
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration
      - org.springframework.boot.autoconfigure.neo4j.Neo4jAutoConfiguration
      - org.springframework.boot.autoconfigure.data.neo4j.Neo4jDataAutoConfiguration
management:
  health:
    redis:
      enabled: false
    neo4j:
      enabled: false
    rabbit:
      enabled: false
---
spring:
  config:
    activate:
      on-profile: docker
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
  datasource:
    url: ${POSTGRES_URL}
    username: ${POSTGRES_USER}
    password: ${POSTGRES_PASSWORD:}
  neo4j:
    uri: ${NEO4J_URI}
    authentication:
      username: ${NEO4J_USER}
      password: ${NEO4J_PASSWORD:}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT}
    username: ${RABBITMQ_USER}
    password: ${RABBITMQ_PASSWORD:}
    publisher-confirm-type: correlated
    publisher-returns: true
ai-platform:
  memory:
    type: redis
